<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body bgcolor="lightblue">
    <h1>Form</h1>
    <div class="form">
    <form>
        <table>
            <tr>
                <td>Name: </td>
                <td><input type="text" name="name"></td>
            </tr>
            <tr>
                <td>Address: </td>
                <td><textarea rows="1" cols="21" name="address"></textarea></td>
            </tr>
            <tr>
            <td>Email: </td>
            <td><input type="email" name="email"></td>
        </tr>
        <tr>
            <td>Phone Number: </td>
            <td><input type="number" name="phone"></td>
        </tr>
        <tr>
            <td><button type="reset">Reset</button></td>
            <td><button type="button" disabled>Submit unavailable</button></td>
        </tr>
        </table>
    </form>
    <p>This static page does not save form submissions.</p>
    </div>
    <div class="video">
        <img src="images.jpg" alt="Image" height="400" width="500">
    </div>
</body>
</html>
